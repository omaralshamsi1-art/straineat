# Generate the Xcode project with:  brew install xcodegen && xcodegen
name: StrainEat
options:
  bundleIdPrefix: ae.sheen
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
targets:
  StrainEat:
    type: application
    platform: iOS
    sources: [StrainEat, Shared]
    dependencies:
      - target: StrainEatWidget
    info:
      path: StrainEat/Resources/Info.plist
      properties:
        CFBundleDisplayName: StrainEat
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        NSCameraUsageDescription: "To photograph your meal and calculate its nutrition"
        NSPhotoLibraryUsageDescription: "To pick a meal photo from your library"
        NSHealthShareUsageDescription: "To read your active and resting calories burned and workouts, and compare them with what you eat"
        NSSpeechRecognitionUsageDescription: "To turn your spoken meal description into text"
        NSMicrophoneUsageDescription: "To record your meal description by voice"
        NSHealthUpdateUsageDescription: "To save your meals and their nutrition to the Health app"
        CFBundleURLTypes:
          - CFBundleURLName: ae.sheen.straineat
            CFBundleURLSchemes: [straineat]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        StrainEatAPIBaseURL: "https://api-production-eacf8540.up.railway.app"
    entitlements:
      path: StrainEat/Resources/StrainEat.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups: [group.ae.sheen.straineat]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.sheen.straineat
        SWIFT_VERSION: "5.10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  StrainEatWidget:
    type: app-extension
    platform: iOS
    sources: [StrainEatWidget, Shared]
    info:
      path: StrainEatWidget/Info.plist
      properties:
        CFBundleDisplayName: StrainEat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StrainEatWidget/StrainEatWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.ae.sheen.straineat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ae.sheen.straineat.widget
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
